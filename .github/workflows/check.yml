name: Check

# OrigaiTV's fast gate (ADR-019, layer 1) on every pull request and every push to
# main: no em dashes, no secrets, no service automation, no owner in code and
# shellcheck, with the same bin/origaitv-check as the forks.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: "Lint, secrets and house rules"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install shellcheck and gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          type -P shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq shellcheck; }
          curl -fsSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      - name: The fast gate
        run: bin/origaitv-check --ci

      - name: The gate catches what it should
        run: test/origaitv/policy/check-test.sh --ci

      # How packages get signed, on a stand-in repository: a release only
      # with OrigaiTV's key, a test run only with its throwaway one, and the
      # key given to the signing job alone.
      - name: The signing scripts sign what they should, and nothing else
        run: test/sign-test.sh

      # What gets built, signed and published, on a stand-in GitHub: only
      # a commit origaitv-os's origaitv branch has, whoever names it.
      - name: The plan builds only what's merged
        run: test/plan-test.sh

      # The version a package gets, with the PKGBUILD's own pkgver() on a
      # stand-in origaitv-os: a release tag's, old style or new, a build's
      # counted from the last release or candidate, and never from one of
      # Omarchy's tags.
      - name: The package's version follows OrigaiTV's release tags
        run: test/pkgver-test.sh

      # The order updates count on, asked of pacman itself in the container
      # the packages are built in: every 0.2.0 build is older than every
      # candidate's, rc10's are newer than rc9's, and all of them are older
      # than 1.0.0. One pair the wrong way round fails here, and stops
      # bin/build before it builds anything.
      - name: pacman sorts every version the way updates count on
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/archlinux/archlinux:latest /src/test/version-order-test.sh

      # What's new for a build: a release's own notes, and for an edge
      # build, a candidate's too, the notes of the release it leads to.
      - name: A build shows the right release's notes
        run: test/release-notes-test.sh

      # A channel keeps every one of OrigaiTV's packages its origaitv depends
      # on, and only ever moves forward.
      - name: A channel keeps what its origaitv needs
        run: test/channel-deps-test.sh

      # makepkg reads the PKGBUILDs as bash; check that they parse and that
      # the keyring's checksums match its files.
      - name: The PKGBUILDs parse
        run: |
          for pkgbuild in */PKGBUILD; do
            ORIGAITV_SOURCE=https://example.invalid/origaitv-os.git ORIGAITV_REF=commit=0 bash -n "$pkgbuild"
          done
          cd origaitv-keyring && sha256sum -c <(sed -n "s/^  '\([0-9a-f]\{64\}\)'  # \(.*\)$/\1  \2/p" PKGBUILD)
